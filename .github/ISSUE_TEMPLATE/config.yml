# A blank issue stays available on purpose. Not every report fits a form, and a
# form that turns people away is worse than a report that arrives untidy.
blank_issues_enabled: true
contact_links:
  - name: Report a vulnerability
    url: https://github.com/sapn95/.github/blob/main/SECURITY.md
    about: Privately, through the Security tab. Never in a public issue.
  - name: How to contribute
    url: https://github.com/sapn95/.github/blob/main/CONTRIBUTING.md
    about: Anyone with a GitHub account may open a pull request. No invitation needed.
